[package]
name = "drmpack"
version = "0.1.1"
edition = "2021"
description = "Native Rust DRM packaging library for CENC/CBCS fMP4 and HLS/DASH manifests"
authors = ["sub2s"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/ermisnetwork/drmpack"

[features]
default = ["cpix", "speke-v2", "axinom", "license-proxy"]
cpix = ["dep:reqwest", "dep:quick-xml"]
speke-v2 = ["cpix", "dep:reqwest"]
axinom = ["speke-v2", "dep:ring"]
license-proxy = ["dep:reqwest"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bytes = { version = "1", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
notify = "8"

# Optional dependencies for key providers
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
quick-xml = { version = "0.37", optional = true }
ring = { version = "0.17", optional = true }
memchr = "2"

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
ring = "0.17"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[[example]]
name = "inspect_axinom"
required-features = ["axinom"]

[[example]]
name = "01_basic_live_cenc"

[[example]]
name = "02_low_latency_dual_cmaf"

[[example]]
name = "03_multitrack_abr_tiers"

[[example]]
name = "04_axinom_key_provider"
required-features = ["axinom"]

[[example]]
name = "05_license_proxy_service"
required-features = ["license-proxy"]

[[example]]
name = "playback_server"
required-features = ["axinom", "license-proxy"]

[[example]]
name = "06_e2e_live_clearkey"
required-features = ["license-proxy"]

[[example]]
name = "07_e2e_live_axinom"
required-features = ["axinom", "license-proxy"]

[[example]]
name = "08_in_memory_live_stream"
required-features = ["axinom"]

[[example]]
name = "09_axum_playback_server"
required-features = ["axinom", "license-proxy"]

