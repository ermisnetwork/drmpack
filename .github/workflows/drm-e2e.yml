name: DRM end-to-end

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  drm-e2e:
    name: GPAC 26.07 CENC/CBCS validation
    runs-on: ubuntu-24.04
    env:
      DRMPACK_REQUIRE_MEDIA_TOOLS: "1"
      GPAC_VERSION: "26.07"
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPAC 26.07 and media tools
        run: |
          sudo apt-get update && sudo apt-get install -y ca-certificates curl
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL --retry 3 --connect-timeout 10 https://dist.gpac.io/gpac/linux/gpg.asc -o /etc/apt/keyrings/gpac.asc || \
          sudo curl -fsSL https://web.archive.org/web/2024/https://dist.gpac.io/gpac/linux/gpg.asc -o /etc/apt/keyrings/gpac.asc
          sudo chmod a+r /etc/apt/keyrings/gpac.asc

          sudo tee /etc/apt/sources.list.d/gpac.sources <<EOF
          Types: deb
          URIs: https://dist.gpac.io/gpac/linux/ubuntu
          Suites: noble
          Components: main
          Signed-By: /etc/apt/keyrings/gpac.asc
          EOF

          sudo apt-get update
          sudo apt-get install -y gpac ffmpeg
      - name: Preflight media tools
        run: |
          gpac -version 2>&1 | grep -F "${GPAC_VERSION}"
          ffmpeg -version
      - name: Run required DRM end-to-end tests
        run: cargo test --all-targets -- --test-threads=1
